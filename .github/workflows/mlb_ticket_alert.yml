name: MLB Ticket Deal Alert & Daily Digest

on:
  schedule:
    # Runs every 2 hours between 8 AM and 10 PM EDT (12:00 to 02:00 UTC) to catch sudden price drops
    # And specifically triggers the daily forward-look morning digest at 9:00 AM EDT (13:00 UTC)
    - cron: '0 12,14,16,18,20,22,0 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub website

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Ticket Alert Agent
        env:
          SMTP_HOST: smtp.mail.me.com
          SMTP_PORT: 587
          SMTP_USER: mrlgp@icloud.com
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SENDER_EMAIL: mrlgp@icloud.com
          MAX_PRICE_PER_TICKET: 50.0
          MIN_TICKET_QTY: 2
        run: |
          python monitor.py --send-daily

      - name: Commit and push updated price history (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add price_history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update ticket price history [skip ci]"
          git push || echo "No changes to push"
